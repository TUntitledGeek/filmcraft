[package]
name = "filmcraft-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Real-time peer-to-peer collaborative editing protocol, presence, and state synchronization for FilmCraft"

[dependencies]
filmcraft-time = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-engine = { workspace = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
log = "0.4"
rand = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.43", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.43", features = ["sync", "macros"] }

[dev-dependencies]
tempfile = "3"
